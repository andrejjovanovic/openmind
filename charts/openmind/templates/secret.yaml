{{- if and (not .Values.existingSecret) (or .Values.ai.anthropicApiKey .Values.oidc.clientSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmind.fullname" . }}
  labels:
    {{- include "openmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.ai.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
